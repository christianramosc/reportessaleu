# Tema oscuro al estilo shadcn/ui (paleta zinc). Los mismos tonos están en ui.py (FONDO, CARTA, BORDE, TEXTO…).
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#18181b"
textColor = "#fafafa"
borderColor = "#27272a"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#27272a"
dataframeHeaderBackgroundColor = "#111113"
linkColor = "#60a5fa"
linkUnderline = false
codeBackgroundColor = "#18181b"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#a78bfa", "#fab219", "#ec835a"]
greenColor = "#22c55e"
redColor = "#ef4444"
yellowColor = "#eab308"
blueColor = "#3b82f6"

[theme.sidebar]
backgroundColor = "#0c0c0e"

[server]
maxUploadSize = 50
